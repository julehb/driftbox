<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Driftbox</title>
        <meta name="description" content="A Javascript Slider" />
        <meta name="robots" content="noindex, nofollow" />
    </head>
    <body>
        <drift-box
            autoplay
            interval="4000"
            pause-on-hover
            pagination
            rounded
            width="80%"
            height="280px">
            <img src="./src/assets/img1.jpg" />
            <img src="./src/assets/img2.jpg" />
            <img src="./src/assets/img3.jpg" />
        </drift-box>

        <script type="module" src="./src/driftbox.js"></script>
    </body>
</html>
